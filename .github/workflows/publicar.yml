# Publica la web en GitHub Pages. La clave de Google Maps no está en el repositorio:
# vive en Settings → Secrets and variables → Actions → GOOGLE_MAPS_KEY y se inyecta aquí, al publicar.
# Si el secreto no existe, app.js queda sin clave y la web enseña el mapa fijo de reserva.
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar la clave de Google Maps
        env:
          CLAVE: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          grep -q "__CLAVE_GOOGLE_MAPS__" app.js
          sed -i "s|__CLAVE_GOOGLE_MAPS__|${CLAVE}|" app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
