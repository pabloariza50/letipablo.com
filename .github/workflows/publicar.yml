# Publica la web en GitHub Pages.
# Antes de publicar se quita lo que no es de la web: el README, el .gitignore y la carpeta _reserva
# (código guardado que no se usa, como el mapa de hoteles incrustado).
# La clave de Google Maps ya no se inyecta: el mapa incrustado está en reserva (ver _reserva/mapa.js).
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Quitar lo que no se publica
        run: rm -rf README.md .gitignore _reserva
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
