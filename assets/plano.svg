<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 940 530" role="img" aria-labelledby="plano-t plano-d" class="plano__svg">
<title id="plano-t">Plano de la boda</title>
<desc id="plano-d">Dibujo de la zona: Sanxenxo, Raxó y Combarro por la PO-308 hasta el Monasterio de Poio; desde allí la VG-4.8 y la PO-531 llevan al Pazo de Señoráns, en Meis, adonde también se llega desde Sanxenxo por la AG-41 y desde Cambados por la VG-4.2. Pontevedra y su estación de tren están junto a Poio, en la AP-9, que va al norte a Santiago y al sur a Vigo.</desc>
<style> .plano__svg { display:block; width:100%; height:auto; } .plano__svg text { font-family:'Architects Daughter', 'Bradley Hand', 'Segoe Print', cursive; fill:#2a3a7a; } .pl-papel { fill:#f6f5e8; } .pl-trazo, .pl-trazo * { fill:none; stroke:#2a3a7a; stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; } .pl-relleno { fill:#f6f5e8 !important; } .pl-via-borde { fill:none; stroke:#2a3a7a; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; } .pl-via-hueco { fill:none; stroke:#f6f5e8; stroke-width:5.6; stroke-linecap:round; stroke-linejoin:round; } .pl-via-rayas { fill:none; stroke:#2a3a7a; stroke-width:5.6; stroke-dasharray:.9 2.4; opacity:.75; } .pl-ref { font-size:12.5px; letter-spacing:.06em; } .pl-sede { font-size:16.5px; letter-spacing:.05em; } .pl-cuando { font-size:12px; letter-spacing:.06em; } .pl-pueblo { font-size:15px; letter-spacing:.08em; } .pl-punto { fill:#2a3a7a; } .pl-fin { fill:#f6f5e8; stroke:#2a3a7a; stroke-width:1.2; } .pl-estela { fill:none; stroke:#2a3a7a; stroke-width:1.1; stroke-dasharray:3 5; stroke-linecap:round; } </style>
